<!DOCTYPE html> 
<html lang="ar">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<link rel="manifest" href="manifest.json">  
<meta name="theme-color" content="#1877f2">  
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700&display=swap" rel="stylesheet">  
<title>صورة التحدي ثابتة</title>  
<style>  
html, body{  
    margin:0;  
    padding:0;  
    width:100%;  
    height:100%;  
    overflow:auto;  
    background: linear-gradient(  
    to bottom,  
    #8E4BD6 50%,  
    #3DE9F5 50%  
  );  
}  .side-text{
position:absolute;
top:50%;
font-size:50px;
font-weight:bold;
color:black;
text-shadow: none;
pointer-events:none;
white-space: nowrap;
transform: translateY(-50%) rotate(50deg);
}

/* نص الأولاد على الشمال */
.left-text{
right:20px;
top:150px;

transform: translateY(-50%) rotate(90deg);

}

.right-text{
right:20px;
top:80%;

transform: translateY(-50%) rotate(90deg);
}

.counter{
display:inline-block;
min-width:60px;
text-align:left;
font-size:40px;
font-weight:bold;
margin-left:15px;
color:black;
}

/* أزرار */
.button {
display:inline-block;
padding:15px 25px;
margin:5px;
font-size:20px;
font-weight:bold;
border:none;
border-radius:8px;
cursor:pointer;
text-align:center;
}

.red { background:#FF4D4D; color:white; }
.yellow { background:#FFD700; color:black; }

.left-buttons{
position:absolute;
left:3px;
top:calc(5% + 60px);
display:flex;
flex-direction: column;
gap:15px;
}

.left-buttons .button {
transform: translateY(-50%) rotate(90deg);
}

.right-buttons{
position:absolute;
left:3px;
top:calc(70% + 60px);
display:flex;
flex-direction: column;
gap:15px;
}

.right-buttons .button {
transform: translateY(-50%) rotate(90deg);

}

/* زر رجوع */
.reset-button{
position:absolute;
top:calc(31% + 150px);
left:10px;
transform: translateY(-50%) rotate(90deg);

padding:5px 13px;              /* حجم مناسب */
font-size:13px;
font-weight:bold;

background:#1877f2;             /* أزرق احترافي /
color:white;                    / النص أبيض */

border:none;
border-left:5px solid #0d5ed7;  /* حافة جانبية /
border-right:5px solid #0d5ed7; / حافة جانبية */

border-radius:5px;              /* حواف ناعمة */
cursor:pointer;
z-index:10;

transition:0.3s;

}
#winnerScreen{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;

    display:none;
    justify-content:center;
    align-items:center;

    background: rgba(0,0,0,0.4);
    z-index:99999;
}

#winnerText{
    display:flex;
    flex-direction:row; /* مهم للعرض */
    align-items:center;
    justify-content:center;
    gap:10px;

    background:white;
    color:black;

    padding:10px 15px;
    border-radius:10px;

    font-size:20px; /* صغير */
    font-weight:bold;

    max-width:50%;
   transform: rotate(90deg);
}
img{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover; 
   transition: transform 1.0s ease-in-out;

}
</style>

</head>  
<body>  
<button id="installBtn" style="  
position:absolute;  
bottom:20px;  
left:50%;  
transform:translateX(-50%);  
padding:12px 25px;  
font-size:16px;  
font-weight:bold;  
background:#28a745;  
color:white;  
border:none;  
border-radius:8px;  
cursor:pointer;  
display:none;  
z-index:20;  
">  
نزّل التطبيق  
</button>  
<!-- زر الرجوع -->
<button class="reset-button" onclick="resetScores()">رجوع</button>

<!-- الصورة -->
<img id="mainImage" src="bj.jpg" alt="challenge">
  <!-- نص الأولاد -->
<div class="side-text left-text">  
  أولاد <span class="counter" id="boysCounter">0</span>  
</div>  

<!-- نص البنات -->
<div class="side-text right-text">  
  بنات <span class="counter" id="girlsCounter">0</span>  
</div>
    <!-- أزرار الأولاد -->
<div class="left-buttons">  
  <button class="button red" onclick="addScore('boys',1)">+1</button>  
  <button class="button red" onclick="addScore('boys',5)">+5</button>  
</div>  

<!-- أزرار البنات -->
<div class="right-buttons">  
  <button class="button yellow" onclick="addScore('girls',1)">+1</button>  
  <button class="button yellow" onclick="addScore('girls',5)">+5</button>  
</div>
<div id="winnerScreen">
  <div id="winnerText"></div>
</div>
<audio id="clickSound" src="click.m4a"></audio>  
<script>
 let boysScore = 0;
let girlsScore = 0;
let imageOffsetY = 0;

function addScore(team, value){

    const sound = document.getElementById('clickSound');
    if(sound){
        sound.currentTime = 0;
        sound.play();
    }

    if(team === 'boys'){
        boysScore += value;
        if(boysScore > 50) boysScore = 50;
    } 
    else if(team === 'girls'){
        girlsScore += value;
        if(girlsScore > 50) girlsScore = 50;
    }

    // تحديث الأرقام (لو موجودة)
    const boysEl = document.getElementById('boysCounter');
    const girlsEl = document.getElementById('girlsCounter');

    if(boysEl) boysEl.innerText = boysScore;
    if(girlsEl) girlsEl.innerText = girlsScore;

    // الحركة
    updateImage();

    // الفوز
    setTimeout(checkWinner, 300);
}

function updateImage(){

    const img = document.getElementById('mainImage');

    const maxScore = 50;

    // 👇 نخلي الحركة على قد الشاشة
    const totalDistance = window.innerHeight / 2;

    const diff = boysScore - girlsScore;

    imageOffsetY = (diff / maxScore) * totalDistance;

    img.style.transform = `translateY(${imageOffsetY}px)`;
}

function resetScores(){
    boysScore = 0;
    girlsScore = 0;
    imageOffsetY = 0;

    const boysEl = document.getElementById('boysCounter');
    const girlsEl = document.getElementById('girlsCounter');
    const img = document.getElementById('mainImage');

    if(boysEl) boysEl.innerText = 0;
    if(girlsEl) girlsEl.innerText = 0;
    if(img) img.style.transform = `translateY(0px)`;
}

function checkWinner(){

    if(boysScore >= 50){
        showWinner("🎉 تهانينا! فوز الشباب 🔥");
        return;
    }

    if(girlsScore >= 50){
        showWinner("🎉 تهانينا! فوز البنات 💛");
        return;
    }
}

function showWinner(text){
    const screen = document.getElementById('winnerScreen');
    const textEl = document.getElementById('winnerText');

    if(!screen || !textEl) return;

    textEl.innerText = text;
    screen.style.display = 'flex';

    setTimeout(() => {
        screen.style.display = 'none';
        resetScores();
    }, 2500);
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js")
  .then(() => console.log("Service Worker Registered"));
}

let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
e.preventDefault();
deferredPrompt = e;
installBtn.style.display = "block";
});

installBtn.addEventListener("click", async () => {
if (deferredPrompt) {
deferredPrompt.prompt();
const { outcome } = await deferredPrompt.userChoice;
if (outcome === "accepted") {
console.log("User accepted install");
}
deferredPrompt = null;
installBtn.style.display = "none";
}
});

</script> 
</body>  
</html>
